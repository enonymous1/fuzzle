name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check and test
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          node --check game.js
          # Explicit file list: `node --test tests/` mis-resolves the
          # directory as a module on the pinned Node version.
          node --test tests/logic.test.js tests/board-smoke.test.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        # NOTE: upload-pages-artifact@v3 requires deploy-pages@v4+;
        # v2 cannot find the v3 artifact ("Cannot find any run").
        uses: actions/deploy-pages@v4
